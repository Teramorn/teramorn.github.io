<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Выбор питомца</title>
    <!-- Подключаем скрипт Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые стили с использованием цветов темы Telegram */
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            padding: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 20px;
        }

        .cookies-badge {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 16px;
            margin-top: 8px;
        }

        .title {
            font-size: 18px;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 20px;
            color: var(--tg-theme-hint-color, #888);
        }

        /* Сетка для яиц 2x2 */
        .eggs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        .egg-card {
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            border: 2px solid transparent;
        }

        .egg-card:active {
            transform: scale(0.95);
            background-color: var(--tg-theme-button-color, #3390ec);
        }

        .egg-card:active .egg-name {
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .egg-emoji {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
        }

        .egg-name {
            font-size: 16px;
            font-weight: bold;
            color: var(--tg-theme-text-color, #000000);
        }

        .egg-desc {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #888);
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="header">
        🐾 Твой питомец
        <div class="cookies-badge">🍪 <span id="cookies">0</span></div>
    </div>

    <div class="title">Выбери магическое яйцо, чтобы начать приключение!</div>

    <div class="eggs-grid">
        <!-- Дракон -->
        <div class="egg-card" onclick="selectPet('dragon')">
            <span class="egg-emoji">🔥🥚</span>
            <div class="egg-name">Дракон</div>
            <div class="egg-desc">Стихия Огня</div>
        </div>

        <!-- Рысь -->
        <div class="egg-card" onclick="selectPet('lynx')">
            <span class="egg-emoji">❄️🥚</span>
            <div class="egg-name">Рысь</div>
            <div class="egg-desc">Стихия Льда</div>
        </div>

        <!-- Волк -->
        <div class="egg-card" onclick="selectPet('wolf')">
            <span class="egg-emoji">⚡🥚</span>
            <div class="egg-name">Волк</div>
            <div class="egg-desc">Стихия Молнии</div>
        </div>

        <!-- Лис -->
        <div class="egg-card" onclick="selectPet('fox')">
            <span class="egg-emoji">🌿🥚</span>
            <div class="egg-name">Лис</div>
            <div class="egg-desc">Стихия Природы</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Сообщаем Telegram, что приложение готово, и разворачиваем на весь экран
        tg.ready();
        tg.expand(); 

        // Получаем имя пользователя для персонализации (опционально)
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.querySelector('.title').innerText = `${user.first_name}, выбери магическое яйцо!`;
        }

        // Функция выбора питомца
        function selectPet(petType) {
            // Вибрация при нажатии (работает на телефонах)
            tg.HapticFeedback.impactOccurred('medium');

            // Формируем данные для отправки боту
            const data = {
                action: "choose_egg",
                pet_type: petType
            };

            // Отправляем данные обратно в бота
            tg.sendData(JSON.stringify(data));
        }

        // TODO: В будущем здесь будет запрос к боту для получения актуального количества печенек
        document.getElementById('cookies').innerText = "150"; // Заглушка для теста
    </script>
</body>
</html>
